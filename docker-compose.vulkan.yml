# Vulkan override (Intel/AMD iGPU): STT runs on ggml/Vulkan; TTS has no Vulkan
# backend, so it falls back to the CPU image.
#   docker compose -f docker-compose.yml -f docker-compose.vulkan.yml up -d --build
services:
  aiudio:
    build:
      dockerfile: docker/tts.cpu.Dockerfile
      args:
        TORCH_SPEC: torch==2.5.1 torchaudio==2.5.1
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cpu
    deploy:
      resources:
        reservations:
          devices: []

  stt:
    image: aiudio-stt-source:local
    build:
      context: .
      dockerfile: docker/stt.Dockerfile
      args:
        BACKEND: vulkan
        NEMO_SPEECH_REF: ${NEMO_SPEECH_REF:-main}
    deploy:
      resources:
        reservations:
          devices: []
    devices:
      - /dev/dri
    group_add:
      - render
