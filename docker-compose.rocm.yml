# AMD ROCm override (Linux). TTS uses the official rocm/pytorch image (sdpa
# attention, no FlashAttention). STT builds from source with the CPU backend
# (HIP/ggml is not provided).
#   docker compose -f docker-compose.yml -f docker-compose.rocm.yml up -d --build
services:
  aiudio:
    build:
      dockerfile: docker/tts.rocm.Dockerfile
    deploy:
      resources:
        reservations:
          devices: []
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
      - render

  stt:
    image: aiudio-stt-source:local
    build:
      context: .
      dockerfile: docker/stt.Dockerfile
      args:
        BACKEND: cpu
    deploy:
      resources:
        reservations:
          devices: []
