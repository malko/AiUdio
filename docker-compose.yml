# Unified TTS + STT stack (CUDA by default).
#   docker compose up -d --build
# Hardware variants (overrides):
#   docker compose -f docker-compose.yml -f docker-compose.rocm.yml up -d --build
#   docker compose -f docker-compose.yml -f docker-compose.cpu.yml  up -d --build
#   docker compose -f docker-compose.yml -f docker-compose.vulkan.yml up -d --build
# Experimental vLLM-Omni service (native PCM streaming):
#   docker compose --profile vllm up -d
name: aiudio

x-nvidia-gpu: &nvidia-gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  # Gateway: Qwen3-TTS engine + REST/OpenAI API + WebSocket + UI + STT/LLM proxies.
  aiudio:
    build:
      context: .
      dockerfile: ${TTS_DOCKERFILE:-docker/tts.Dockerfile}
      args:
        BASE_IMAGE: ${TTS_BASE_IMAGE:-pytorch/pytorch:2.5.1-cuda12.4-cudnn9-runtime}
        TORCH_SPEC: ${TTS_TORCH_SPEC:-torch==2.5.1 torchaudio==2.5.1}
        TORCH_INDEX_URL: ${TTS_TORCH_INDEX_URL:-https://download.pytorch.org/whl/cu124}
    image: aiudio-server:local
    ports:
      - "${PORT:-8004}:8004"
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./voices:/app/voices
      - ./reference_audio:/app/reference_audio
      - ./outputs:/app/outputs
      - ./logs:/app/logs
      - hf_cache:/app/hf_cache
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HUB_ENABLE_HF_TRANSFER=${HF_HUB_ENABLE_HF_TRANSFER:-1}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:8080/v1}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - STT_BASE_URL=http://stt:8080
      - AUTH_ENABLED=${AUTH_ENABLED:-false}
      - AUTH_USERNAME=${AUTH_USERNAME:-admin}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-}
      - AUTH_API_KEYS=${AUTH_API_KEYS:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    <<: *nvidia-gpu
    restart: unless-stopped
    networks: [speech]

  # STT: NeMo-Speech.cpp (Parakeet TDT v3 offline + Nemotron 3.5 streaming + diarization).
  stt:
    build:
      context: .
      dockerfile: docker/stt.Dockerfile
      args:
        BACKEND: ${STT_BACKEND:-cuda}
        NEMO_SPEECH_REF: ${NEMO_SPEECH_REF:-main}
        CUDA_BUILDER_IMAGE: ${STT_CUDA_BUILDER_IMAGE:-nvidia/cuda:13.4.2-devel-ubuntu26.04}
        CUDA_RUNTIME_IMAGE: ${STT_CUDA_RUNTIME_IMAGE:-nvidia/cuda:13.4.2-runtime-ubuntu26.04}
        CUDA_ARCHITECTURES: ${STT_CUDA_ARCHITECTURES:-}
    image: aiudio-stt:local
    ports:
      - "${STT_PORT:-8080}:8080"
    volumes:
      # Shared model cache. Defaults to the same named volume as the TTS HF cache,
      # under a subdirectory for NeMo-Speech. Set STT_MODELS_DIR to a host path to
      # use a bind mount instead.
      - ${STT_MODELS_DIR:-hf_cache}:/hf_cache
    environment:
      - STT_ASR_MODEL=${STT_ASR_MODEL:-nemotron-3.5}
      - STT_PORT=8080
      - NEMO_SPEECH_MODEL_INDEX=${NEMO_SPEECH_MODEL_INDEX:-/usr/local/share/nemo-speech/model-index.json}
      - NEMO_SPEECH_MODEL_DIR=${NEMO_SPEECH_MODEL_DIR:-/hf_cache/nemo-speech/models}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    <<: *nvidia-gpu
    restart: unless-stopped
    networks: [speech]

  # Optional: vLLM-Omni (official image) for native PCM streaming.
  tts-vllm:
    image: ${VLLM_OMNI_IMAGE:-vllm/vllm-omni:latest}
    profiles: ["vllm"]
    command: >
      vllm serve Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice
      --omni --host 0.0.0.0 --port 8091
    ports:
      - "8005:8091"
    volumes:
      - hf_cache:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - NVIDIA_VISIBLE_DEVICES=all
    <<: *nvidia-gpu
    restart: unless-stopped
    networks: [speech]

networks:
  speech:
    name: aiudio-net

volumes:
  hf_cache:
