# AiUdio stack (CUDA 13): TTS gateway + official NeMo-Speech.cpp STT image.
#   docker compose up -d --build
# Optional experimental vLLM-Omni service (native PCM streaming):
#   docker compose --profile vllm up -d
name: aiudio

x-nvidia-gpu: &nvidia-gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            device_ids:
              - 'GPU-fb340601-4e43-19d9-289f-3a9d41aaa23e' # gygabyte rtx 5060ti python III
            # count: all
            capabilities: [gpu]

services:
  # Gateway: Qwen3-TTS engine + REST/OpenAI API + WebSocket + UI + STT/LLM proxies.
  aiudio:
    build:
      context: .
      dockerfile: docker/tts.Dockerfile
      args:
        BASE_IMAGE: ${TTS_BASE_IMAGE:-pytorch/pytorch:2.14.1-cuda13.0-cudnn9-runtime}
        TORCH_SPEC: ${TTS_TORCH_SPEC-}
        TORCH_INDEX_URL: ${TTS_TORCH_INDEX_URL:-https://download.pytorch.org/whl/cu130}
        INSTALL_CHATTERBOX: ${INSTALL_CHATTERBOX:-1}
        CHATTERBOX_SPEC: ${CHATTERBOX_SPEC:-git+https://github.com/resemble-ai/chatterbox.git}
    image: aiudio-server:local
    ports:
      - "${PORT:-8004}:8004"
    volumes:
      # config.yaml is mounted READ-ONLY as defaults; the service writes its
      # runtime settings to the writable aiudio_state volume instead, so the
      # repository file is never rewritten by the container.
      - ./config.yaml:/app/config.defaults.yaml:ro
      - aiudio_state:/app/state
      - ./voices:/app/voices
      - ./reference_audio:/app/reference_audio
      - ./outputs:/app/outputs
      - ./logs:/app/logs
      - hf_cache:/app/hf_cache
    environment:
      - CONFIG_DEFAULTS=/app/config.defaults.yaml
      - CONFIG_PATH=/app/state/config.yaml
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HUB_ENABLE_HF_TRANSFER=${HF_HUB_ENABLE_HF_TRANSFER:-1}
      # Model residency: 'single' (default, one family in VRAM at a time) or
      # 'multi' (keep models.resident loaded; needs more VRAM). Unset keeps the
      # value persisted in the state volume.
      - TTS_RESIDENCY=${TTS_RESIDENCY:-}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # LLM/Auth: only override when explicitly set in .env, otherwise the values
      # persisted in the aiudio_state volume (edited from the UI) are kept across
      # restarts.
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - STT_BASE_URL=http://stt:8080
      - AUTH_ENABLED=${AUTH_ENABLED:-}
      - AUTH_USERNAME=${AUTH_USERNAME:-}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    <<: *nvidia-gpu
    restart: unless-stopped
    networks: [speech]

  # STT: NeMo-Speech.cpp (Parakeet TDT v3 offline + Nemotron 3.5 streaming + diarization).
  # Default: official NVIDIA NGC image (CUDA, multi-arch), wrapped in a tiny image
  # that adds busybox for the wait-for-model entrypoint. For CPU/Vulkan/ROCm use the
  # cpu/vulkan/rocm overrides, which build NeMo-Speech.cpp from source instead.
  stt:
    build:
      context: .
      dockerfile: docker/stt-nvcr.Dockerfile
      args:
        STT_BASE_IMAGE: ${STT_IMAGE:-nvcr.io/nvidia/nemo-speech.cpp:0.2.0}
    image: aiudio-stt:local
    entrypoint: ["/bin/sh", "/stt-wait.sh"]
    ports:
      - "${STT_PORT:-8080}:8080"
    volumes:
      # Shared model cache. Defaults to the same named volume as the TTS HF cache,
      # under a subdirectory for NeMo-Speech. Set STT_MODELS_DIR to a host path to
      # use a bind mount instead.
      - ${STT_MODELS_DIR:-hf_cache}:/hf_cache
    environment:
      - STT_PORT=8080
      - NEMO_SPEECH_MODEL_DIR=${NEMO_SPEECH_MODEL_DIR:-/hf_cache/nemo-speech/models}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    <<: *nvidia-gpu
    restart: unless-stopped
    networks: [speech]

  # Optional: vLLM-Omni (official image) for native PCM streaming.
  # CLI: `docker compose --profile vllm up -d` (or `up -d tts-vllm`).
  # Managers that cannot pass a profile (Web UI, Dockge, Portainer...): delete the
  # `profiles` line below so the service belongs to the default stack, then
  # start/stop the container from the UI. It reserves its own VRAM, so keep it
  # stopped when unused.
  tts-vllm:
    image: ${VLLM_OMNI_IMAGE:-vllm/vllm-omni:latest}
    profiles: ["vllm"]
    # The model served here is this argument alone — the gateway's
    # `models.registry`/`default_size` only drive its *local* engine.
    # On a small or shared card, add `--max-model-len 2048 --enforce-eager` and
    # budget the two stages (0 = talker, 1 = Code2Wav) separately, e.g.
    #   --stage-overrides '{"0": {"gpu_memory_utilization": 0.20}, "1": {"gpu_memory_utilization": 0.10}}'
    # A global `--gpu-memory-utilization` would replace *both* shares and make
    # stage 1 die with CUDA OOM. See docs/realtime.md.
    command: >
      vllm serve Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice
      --omni --host 0.0.0.0 --port 8091
    # vLLM needs a large shared-memory segment (Docker's default is 64 MB).
    shm_size: "8gb"
    ports:
      - "8005:8091"
    volumes:
      - hf_cache:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - NVIDIA_VISIBLE_DEVICES=all
      # Fragmentation advice from torch's own OOM message.
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    <<: *nvidia-gpu
    restart: unless-stopped
    networks: [speech]

networks:
  speech:
    name: aiudio-net

volumes:
  hf_cache:
  aiudio_state:
