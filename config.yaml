server:
  host: 0.0.0.0
  port: 8004
  cors_origins:
  - '*'
  log_level: info
paths:
  voices: voices
  reference_audio: reference_audio
models:
  registry:
    custom_voice: Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice
    voice_design: Qwen/Qwen3-TTS-12Hz-1.7B-VoiceDesign
    base: Qwen/Qwen3-TTS-12Hz-0.6B-Base
    chatterbox: ResembleAI/chatterbox
    chatterbox_turbo: ResembleAI/chatterbox-turbo
    chatterbox_nano: ResembleAI/chatterbox-nano
  variants:
  - id: custom_voice:1.7B
    family: custom_voice
    repo: Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice
    label: 1.7B
    backend: qwen3
  - id: custom_voice:0.6B
    family: custom_voice
    repo: Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice
    label: 0.6B
    backend: qwen3
  - id: voice_design:1.7B
    family: voice_design
    repo: Qwen/Qwen3-TTS-12Hz-1.7B-VoiceDesign
    label: 1.7B
    backend: qwen3
  - id: base:1.7B
    family: base
    repo: Qwen/Qwen3-TTS-12Hz-1.7B-Base
    label: 1.7B
    backend: qwen3
  - id: base:0.6B
    family: base
    repo: Qwen/Qwen3-TTS-12Hz-0.6B-Base
    label: 0.6B
    backend: qwen3
  - id: chatterbox:v3
    family: chatterbox
    repo: ResembleAI/chatterbox
    label: v3
    backend: chatterbox
  - id: chatterbox:v2
    family: chatterbox
    repo: ResembleAI/chatterbox
    label: v2
    backend: chatterbox
  - id: chatterbox:zh-cmn
    family: chatterbox
    repo: ResembleAI/Chatterbox-Multilingual-zh-cmn
    label: zh-cmn
    backend: chatterbox
  - id: chatterbox:pt-br
    family: chatterbox
    repo: ResembleAI/Chatterbox-Multilingual-pt-br
    label: pt-br
    backend: chatterbox
  - id: chatterbox:hi
    family: chatterbox
    repo: ResembleAI/Chatterbox-Multilingual-hi
    label: hi
    backend: chatterbox
  - id: chatterbox_turbo:turbo
    family: chatterbox_turbo
    repo: ResembleAI/chatterbox-turbo
    label: Turbo
    backend: chatterbox
  - id: chatterbox_nano:nano
    family: chatterbox_nano
    repo: ResembleAI/chatterbox-nano
    label: Nano
    backend: chatterbox
  default_family: custom_voice
  default_size: 0.6B
  # single: one family in VRAM at a time (hot-swap). multi: keep models.resident
  # loaded (more VRAM); also settable with TTS_RESIDENCY=multi.
  residency: single
  resident:
  - custom_voice
  clone_backend: qwen3
  stabilize_voice_design: false
  chatterbox:
    python: ''
    t3_model: v3
    watermark: false
    default_language: English
  device: auto
  dtype: bfloat16
  attn_implementation: sdpa
  hf_home: /app/hf_cache
generation:
  temperature: 0.9
  top_k: 50
  top_p: 1.0
  repetition_penalty: 1.05
  max_new_tokens: 2048
  subtalker_temperature: 0.9
  subtalker_top_k: 50
  subtalker_top_p: 1.0
  batch_size: 4
  batch_window_ms: 25
  exaggeration: 0.5
  cfg_weight: 0.5
  min_p: 0.05
chunking:
  enabled: true
  # Chunk size, 40..600: one chunk must fit in a single generation (beyond ~600
  # chars the engine would drop the tail). Cuts land on punctuation/word breaks.
  max_chars: 240
  silence_ms: 120
# Input-text cleanup (applied before the text is split; API keys may override it).
#   cleanup:     off (nothing) | light (invisible characters, spacing, quotes) |
#                llm (also strips markdown and code fences)
#   emoji:       keep | strip (removed) | name (the ~20 most frequent are spoken)
#   code_blocks: drop | announce ("bloc de code") — used by `cleanup: llm`
text:
  cleanup: off
  emoji: keep
  code_blocks: drop
audio:
  # Output encoding default (also overridable per request). The sample rate is
  # not a setting: the local engines emit 24 kHz, nothing is resampled, and every
  # PCM response announces the rate of its own samples in X-Sample-Rate.
  format: wav
  allow_remote_media: false
  allow_local_ref_paths: false
stt:
  enabled: true
  base_url: http://stt:8080
  transcribe_path: /v1/audio/transcriptions
  realtime_path: /v1/audio/transcriptions/realtime
  diarize_path: /v1/audio/diarizations
  api_key: ''
  # Input language hint: '' = auto (the model decides; the multilingual ones detect
  # the language). A name or an ISO code is accepted and normalized (French → fr).
  # It only changes the decoding of prompt-conditioned models (the streaming
  # Nemotron ASR); Parakeet TDT v3 accepts it but ignores it. Applies to the file
  # endpoint and to the realtime socket when the client does not send its own.
  language: ''
  # Codes offered as suggestions in the UI (e.g. [fr, en]); empty keeps a free field.
  languages: []
  model_index: /app/app/data/nemo-speech-model-index.json
  models_dir: /app/hf_cache/nemo-speech/models
  hf_base_url: https://huggingface.co
llm:
  base_url: http://host.docker.internal:8080/v1
  api_key: ''
  model: ''
  system_prompt: You are a helpful voice assistant. Answer concisely, in complete
    sentences, in the language of the user.
  temperature: 0.7
  max_tokens: -1
  history_turns: 12
vllm:
  # EXPERIMENTAL, and may be dropped in a future release. It can cut the
  # time-to-first-audio of Qwen3-TTS (native codec-window PCM) but costs a much
  # larger VRAM footprint (a per-stage share of the whole card), a ~1 min cold
  # start, extra stack complexity (a second container to pilot) and per-stage
  # budgets to tune by hand. The local engines are the supported path; see
  # docs/backends.md#why-vllm-omni-stays-optional.
  #
  # The TTS engine switch: true routes the family below to the vLLM-Omni service
  # (started on demand when docker.control is enabled), false keeps everything on
  # our own models and stops the service.
  enabled: false
  base_url: http://tts-vllm:8091
  # Checkpoint the service was started with: custom_voice (preset speakers) or
  # base (voice cloning from a reference clip). Requests of the other family stay
  # on the local engine — the service loads a single model.
  family: custom_voice
  # Path the *service* sees the voice bank at (read-only mount), e.g. /svc/voices:
  # reference clips are then sent as file:// URIs instead of inline base64.
  ref_root: ''
  # Hibernation: seconds without a vLLM request before the running service is asked
  # to release its VRAM (0 = never). Needs `--enable-sleep-mode` on the service;
  # the next request wakes it up first. Level 1 = weights in host RAM (fast wake).
  sleep_after: 0.0
  sleep_level: 1
  # Launch profile the gateway applies when it recreates the container itself
  # (needs docker.control): the checkpoint to serve ('' = whatever the compose
  # started it with) and the flags. `stage_memory` empty = computed from the
  # checkpoint and the card (GET /api/vllm/budget); pin a stage to overrule it.
  model: ''
  max_model_len: 2048
  enforce_eager: true
  stage_memory: {}
  # What to do when the engine is selected for a family but the service is
  # unreachable/not ready: false fails the request with an explicit 503 (so a
  # silent switch to the local models cannot hide a broken service); true keeps
  # serving from the local engine as a fallback.
  fallback_to_local: false
docker:
  # Pilot the vLLM-Omni container (start/stop/switch its checkpoint) from the UI.
  # Off by default: it requires the Docker socket, i.e. root-equivalent power over
  # the host. See docs/security.md.
  control: false
  socket: /var/run/docker.sock
  container: tts-vllm
  start_timeout: 300.0
ui:
  title: AiUdio Server
  show_stt_tab: true
  show_chat_tab: true
startup:
  # STT model to activate at boot ('' = nothing: load on first use).
  stt_model: ''
auth:
  enabled: false
  username: admin
  password: ''
  api_keys: []
  session_ttl_minutes: 480
  exempt_paths:
  - /health
  - /ready
