# Legacy CUDA 12 override (driver < 580). The default STT build uses CUDA 13.4 on
# Ubuntu 26.04, which needs a >= 580 driver; this reverts STT to CUDA 12.8 / Ubuntu
# 24.04 and pins the TTS gateway to the CUDA 12.4 PyTorch image.
#   docker compose -f docker-compose.yml -f docker-compose.cuda12.yml up -d --build
services:
  aiudio:
    build:
      args:
        BASE_IMAGE: ${TTS_BASE_IMAGE:-pytorch/pytorch:2.5.1-cuda12.4-cudnn9-runtime}
        TORCH_SPEC: ${TTS_TORCH_SPEC:-torch==2.5.1 torchaudio==2.5.1}
        TORCH_INDEX_URL: ${TTS_TORCH_INDEX_URL:-https://download.pytorch.org/whl/cu124}

  stt:
    build:
      args:
        CUDA_BUILDER_IMAGE: ${STT_CUDA_BUILDER_IMAGE:-nvidia/cuda:12.8.1-devel-ubuntu24.04}
        CUDA_RUNTIME_IMAGE: ${STT_CUDA_RUNTIME_IMAGE:-nvidia/cuda:12.8.1-runtime-ubuntu24.04}
